<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - My Website</title>
    <link rel="stylesheet" href="assets/css/main.css">
    </head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <header id="header">
                    </header>

                <section>
                    <header class="main">
                        <h1>Create Your Account</h1>
                    </header>

                    <p>Please fill out the form below to sign up.</p>

                    <form method="post" action="#"> <div class="row gtr-uniform">
                            <div class="col-6 col-12-xsmall">
                                <input type="text" name="username" id="username" value="" placeholder="Username" required />
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <input type="email" name="email" id="email" value="" placeholder="Email Address" required />
                            </div>
                            <div class="col-12">
                                <input type="password" name="password" id="password" value="" placeholder="Password" required />
                            </div>
                            <div class="col-12">
                                <input type="password" name="confirm-password" id="confirm-password" value="" placeholder="Confirm Password" required />
                            </div>
                          
                            <div class="col-12">
                                <ul class="actions">
                                    <li><input type="submit" value="Sign Up" class="primary" /></li>
                                    <li><input type="reset" value="Clear Form" /></li>
                                </ul>
                            </div>
                        </div>
                    </form>

                    <hr class="major" /> <p>Already have an account? <a href="index.html">Log In here</a></p>

                </section>
            </div>
        </div>
        </div>

    </body>
</html>
