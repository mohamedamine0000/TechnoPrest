<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <style>
        .is-invalid {
            border: 2px solid red !important;
        }
        .error-message {
            color: red;
            font-size: 0.85em;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <div class="login-container">
                    <form class="login-form" method="post" action="#" id="login-form">
                        <h2>Login</h2>
                        <div class="row gtr-uniform">
                            <div class="col-12">
                                <input type="text" name="CIN" id="CIN" placeholder="CIN (8 digits)" required />
                                <span id="cin-error" class="error-message" style="display: none;"></span>
                            </div>
                            <div class="col-12">
                                <input type="password" name="password" id="password" placeholder="Password" required />
                            </div>
                            <div class="col-12">
                                <ul class="actions" style="display: flex; justify-content: center;">
                                    <li><input type="submit" value="Log In" class="primary" /></li>
                                    <li><a href="signup.html" class="button">Sign Up</a></li>
                                </ul>
                            </div>
                        </div>
                        <p class="mt-4" style="color: white;">Forgot your password? <a href="#">Reset here</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const cinInput = document.getElementById('CIN');
            const passwordInput = document.getElementById('password');
            const cinErrorSpan = document.getElementById('cin-error');

            function validateCin() {
                const value = cinInput.value.trim();
                let errorMessage = '';
                let isValid = true;

                if (value === '') {
                    errorMessage = '';
                    isValid = true;
                } else if (/[^0-9]/.test(value)) {
                    errorMessage = 'CIN can only contain numbers.';
                    isValid = false;
                } else if (value.length !== 8) {
                    errorMessage = 'CIN must be exactly 8 digits.';
                    isValid = false;
                }

                if (errorMessage) {
                    cinErrorSpan.textContent = errorMessage;
                    cinErrorSpan.style.display = 'block';
                    cinInput.classList.add('is-invalid');
                } else {
                    cinErrorSpan.textContent = '';
                    cinErrorSpan.style.display = 'none';
                    cinInput.classList.remove('is-invalid');
                }
                return isValid;
            }

            if (cinInput && cinErrorSpan && loginForm && passwordInput) {
                cinInput.addEventListener('input', validateCin);

                loginForm.addEventListener('submit', async function(event) {
                    event.preventDefault();

                    const isCinValid = validateCin();
                    const isPasswordValid = passwordInput.value.trim() !== '';

                    if (!isCinValid || !isPasswordValid) {
                        if (!isCinValid) cinInput.focus();
                        else if (!isPasswordValid) passwordInput.focus();
                        return;
                    }

                    const cin = cinInput.value.trim();
                    const password = passwordInput.value;

                    // --- API CALL SCRIPT START ---
                    try {
                        const response = await fetch('/api/users/login', {
                         method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ cin: cin, password: password })
                        });

                        let responseData;
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.includes("application/json")) {
                            responseData = await response.json();
                        } else {
                            responseData = { message: await response.text() };
                        }

                        if (response.ok) {
                            const loggedInUserId = responseData.userId;

                            if (loggedInUserId) {
                                sessionStorage.setItem('loggedInUserId', loggedInUserId);
                                window.location.href = '/profile.html';
                            } else {
                                alert('Login successful, but user ID not received.');
                            }

                        } else {
                            console.error('Login failed:', responseData);
                            alert('Login failed: ' + (responseData.message || 'Invalid credentials.'));
                        }
                    } catch (error) {
                        console.error('Error during login fetch:', error);
                        alert('An unexpected error occurred. Please try again later.');
                    }
                });
            }
        });
    </script>
</body>
</html>
