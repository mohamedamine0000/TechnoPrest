<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Articles</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* ... (Your existing styles) ... */

        /* Specific styles for the article list page */
        .article-table-container {
            margin-top: 2em;
            overflow-x: auto;
        }

        .article-table {
            width: 100%;
            border-collapse: collapse;
        }

        .article-table th,
        .article-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        .article-table th {
            background-color: #f2f2f2;
        }

        .search-container {
            margin-bottom: 1em;
        }

        .search-container input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .filter-container {
            margin-bottom: 1em;
        }

        .filter-container .roles-dropdown {
            margin-top: 10px;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff;
            border-radius: 4px;
        }

        .filter-container label {
            display: block;
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }
        
        /* NEW: Styles for the selected role label */
        .filter-container .selected-role {
            background-color: #e0e0e0;
            font-weight: bold;
        }
    </style>
</head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <header id="header">
                    <a href="/profile.html" class="logo"><strong>My App</strong> Articles</a>
                    <ul class="icons">
                        <li>
                            <button id="logout-button-main-header" class="fas fa-sign-out-alt">
                                <span class="label">Logout</span>
                            </button>
                        </li>
                    </ul>
                </header>

                <div id="loading-message" class="loading-message">
                    Loading articles...
                </div>
                <div id="error-message" class="error-message" style="display: none;">
                    Could not load articles.
                </div>

                <div class="search-container">
                    <input type="text" id="article-search" placeholder="Search by Code Article or Designation...">
                </div>

                <div id="role-filter-container" class="filter-container" style="display: none;">
                    <button id="toggle-roles-button">Filter by Role</button>
                    <div id="roles-dropdown" class="roles-dropdown" style="display: none;">
                        </div>
                </div>

                <div class="article-table-container">
                    <table class="article-table">
                        <thead>
                            <tr>
                                <th>Code Article</th>
                                <th>Designation</th>
                                <th>Quantity (Qte)</th>
                                <th id="role-header-col" style="display: none;">Role</th>
                            </tr>
                        </thead>
                        <tbody id="articles-list-body">
                            </tbody>
                    </table>
                </div>

            </div>
        </div>

        </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const articlesListBody = document.getElementById('articles-list-body');
            const searchInput = document.getElementById('article-search');
            const loadingMessage = document.getElementById('loading-message');
            const errorMessage = document.getElementById('error-message');
            const roleFilterContainer = document.getElementById('role-filter-container');
            const toggleRolesButton = document.getElementById('toggle-roles-button');
            const rolesDropdown = document.getElementById('roles-dropdown');
            const roleHeaderCol = document.getElementById('role-header-col');
            const loggedInUserId = sessionStorage.getItem('loggedInUserId');
            
            let allArticles = [];
            let allRoles = [];
            let currentUserRole = '';
            let selectedRoles = [];

            function renderArticles(articlesToDisplay) {
                articlesListBody.innerHTML = '';
                if (articlesToDisplay.length === 0) {
                    articlesListBody.innerHTML = '<tr><td colspan="4">No articles found.</td></tr>';
                    return;
                }
                articlesToDisplay.forEach(article => {
                    const row = articlesListBody.insertRow();
                    const roleName = article.role && article.role.name ? article.role.name : 'N/A';
                    
                    row.innerHTML = `
                        <td>${article.codeArticle}</td>
                        <td>${article.designation}</td>
                        <td>${article.qte}</td>
                        <td class="article-role-col">${roleName}</td>
                    `;
                });
            }

            function filterAndRenderArticles() {
                const searchTerm = searchInput.value.toLowerCase();
                let filteredArticles = allArticles.filter(article => {
                    const matchesSearch = article.codeArticle.toLowerCase().includes(searchTerm) ||
                                          article.designation.toLowerCase().includes(searchTerm);
                    
                    const articleRoleName = article.role && article.role.name ? article.role.name : 'N/A';
                    const matchesRole = selectedRoles.length === 0 || selectedRoles.includes(articleRoleName);

                    return matchesSearch && matchesRole;
                });
                renderArticles(filteredArticles);
            }

            async function fetchArticles() {
                loadingMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                try {
                    const response = await fetch('/api/users/articles');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    allArticles = await response.json();
                    loadingMessage.style.display = 'none';

                    if (currentUserRole === 'Admin') {
                        roleHeaderCol.style.display = 'table-cell';
                        document.querySelectorAll('.article-role-col').forEach(el => el.style.display = 'table-cell');
                        renderArticles(allArticles);
                    } else {
                        const filteredByRole = allArticles.filter(article => 
                            article.role && article.role.name === currentUserRole
                        );
                        renderArticles(filteredByRole);
                    }
                    
                } catch (error) {
                    console.error('Error fetching articles:', error);
                    loadingMessage.style.display = 'none';
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'Failed to load articles. Please try again later.';
                }
            }
            
            async function fetchUserRole() {
                if (!loggedInUserId) {
                    console.error('No user logged in.');
                    errorMessage.textContent = 'Please log in to view articles.';
                    errorMessage.style.display = 'block';
                    loadingMessage.style.display = 'none';
                    return;
                }
                try {
                    const response = await fetch(`/api/users/${loggedInUserId}`);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const user = await response.json();
                    currentUserRole = user.roleName;

                    if (currentUserRole === 'Admin') {
                        roleFilterContainer.style.display = 'block';
                    }

                } catch (error) {
                    console.error('Error fetching user role:', error);
                }
            }

            // UPDATED: Fetch roles from the correct backend endpoint and populate the dropdown with CSS class toggling
            async function fetchRolesAndPopulateDropdown() {
                try {
                    const response = await fetch('/api/roles');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    allRoles = await response.json();
                    
                    rolesDropdown.innerHTML = '';
                    allRoles.forEach(role => {
                        const label = document.createElement('label');
                        label.innerHTML = `
                            <input type="checkbox" name="role" value="${role.name}"> ${role.name}
                        `;
                        rolesDropdown.appendChild(label);
                    });

                    rolesDropdown.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                        checkbox.addEventListener('change', function() {
                            const label = this.closest('label');
                            if (this.checked) {
                                selectedRoles.push(this.value);
                                label.classList.add('selected-role'); // Add class
                            } else {
                                selectedRoles = selectedRoles.filter(role => role !== this.value);
                                label.classList.remove('selected-role'); // Remove class
                            }
                            filterAndRenderArticles();
                        });
                    });
                } catch (error) {
                    console.error('Error fetching roles:', error);
                }
            }

            searchInput.addEventListener('keyup', filterAndRenderArticles);
            toggleRolesButton.addEventListener('click', () => {
                rolesDropdown.style.display = rolesDropdown.style.display === 'none' ? 'block' : 'none';
            });
            
            await fetchUserRole();
            if (currentUserRole === 'Admin') {
                await fetchRolesAndPopulateDropdown();
            }
            await fetchArticles();
        });
    </script>
</body>
</html>
