<html lang="en">
<head>

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* Your existing styles for the main layout */

}

            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

            opacity: 1;
        }

            min-height: 100vh;

        }

<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <header id="header">
                    <a href="/profile.html" class="logo"><strong>My App</strong> Articles</a>
                    <ul class="icons">
                        <li>
                            <button id="logout-button-main-header" class="fas fa-sign-out-alt">
                                <span class="label">Logout</span>
                            </button>
                        </li>
                    </ul>
                </header>

                <div id="loading-message" class="loading-message">
                    Loading articles...
                </div>
                <div id="error-message" class="error-message" style="display: none;">
                    Could not load articles.
                </div>

                <p id="user-info-display">Loading user info...</p>
                
                <div class="search-container">
                    <input type="text" id="article-search" placeholder="Search by Code Article or Designation...">
                </div>

                <div id="role-filter-container" class="filter-container" style="display: none;">
                    <button id="toggle-roles-button">Filter by Role</button>
                    <div id="roles-dropdown" class="roles-dropdown" style="display: none;">

                        </thead>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables moved here
        let allArticles = [];
        let allRoles = [];
        let allMovements = []; // Moved to global scope
        let currentUserRole = '';
        let currentUserCin = ''; 
        let selectedRoles = [];
        let articlesListBody;
        let searchInput;
        let loadingMessage;
        let errorMessage;
        let roleFilterContainer;
        let toggleRolesButton;
        let rolesDropdown;
        let roleHeaderCol;
        let loggedInUserId;
        let userInfoDisplay;
        let logoutButtonMainHeader;

        // Global functions for handling user actions
       window.handleSellArticle = async function(articleId, currentQte, userCin) {
    if (currentQte <= 0) {
        alert('Cannot sell an article with a quantity of 0.');
        return;
    }

    if (!userCin) {
        alert('User information not available. Please refresh and try again.');
        return;
    }

    // Function to show the complete sell form in a modal
    const showSellForm = (currentQuantity) => {
        return new Promise((resolve) => {
            const tunisianStates = [
                "Ariana", "Beja", "Ben Arous", "Bizerte", "Gabes", "Gafsa",
                "Jendouba", "Kairouan", "Kasserine", "Kebili", "Kef", "Mahdia",
                "Manouba", "Medenine", "Monastir", "Nabeul", "Sfax", "Sidi Bouzid",
                "Siliana", "Sousse", "Tataouine", "Tozeur", "Tunis", "Zaghouan"
            ];

            // Create modal container
            const modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';
            modal.style.backgroundColor = 'rgba(0,0,0,0.5)';
            modal.style.display = 'flex';
            modal.style.justifyContent = 'center';
            modal.style.alignItems = 'center';
            modal.style.zIndex = '1000';

            // Create form container
            const formContainer = document.createElement('div');
            formContainer.style.backgroundColor = 'white';
            formContainer.style.padding = '20px';
            formContainer.style.borderRadius = '8px';
            formContainer.style.width = '400px';
            formContainer.style.maxWidth = '90%';

            // Create form title
            const title = document.createElement('h3');
            title.textContent = 'Sell Article';
            title.style.marginTop = '0';
            title.style.textAlign = 'center';
            formContainer.appendChild(title);

            // Create form element
            const form = document.createElement('form');
            
            // Quantity field
            const quantityGroup = document.createElement('div');
            quantityGroup.style.marginBottom = '15px';
            
            const quantityLabel = document.createElement('label');
            quantityLabel.textContent = `Quantity (max: ${currentQuantity}):`;
            quantityLabel.style.display = 'block';
            quantityLabel.style.marginBottom = '5px';
            
            const quantityInput = document.createElement('input');
            quantityInput.type = 'number';
            quantityInput.min = '1';
            quantityInput.max = currentQuantity;
            quantityInput.value = '1';
            quantityInput.style.width = '100%';
            quantityInput.style.padding = '8px';
            quantityInput.style.boxSizing = 'border-box';
            quantityInput.required = true;
            
            quantityGroup.appendChild(quantityLabel);
            quantityGroup.appendChild(quantityInput);
            form.appendChild(quantityGroup);

            // Client name field
            const clientGroup = document.createElement('div');
            clientGroup.style.marginBottom = '15px';
            
            const clientLabel = document.createElement('label');
            clientLabel.textContent = 'Client Name:';
            clientLabel.style.display = 'block';
            clientLabel.style.marginBottom = '5px';
            
            const clientInput = document.createElement('input');
            clientInput.type = 'text';
            clientInput.style.width = '100%';
            clientInput.style.padding = '8px';
            clientInput.style.boxSizing = 'border-box';
            clientInput.required = true;
            
            clientGroup.appendChild(clientLabel);
            clientGroup.appendChild(clientInput);
            form.appendChild(clientGroup);

            // Client zone field
            const zoneGroup = document.createElement('div');
            zoneGroup.style.marginBottom = '15px';
            
            const zoneLabel = document.createElement('label');
            zoneLabel.textContent = 'Client Zone:';
            zoneLabel.style.display = 'block';
            zoneLabel.style.marginBottom = '5px';
            
            const zoneSelect = document.createElement('select');
            zoneSelect.style.width = '100%';
            zoneSelect.style.padding = '8px';
            zoneSelect.style.boxSizing = 'border-box';
            zoneSelect.required = true;
            
            tunisianStates.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                zoneSelect.appendChild(option);
            });
            
            zoneGroup.appendChild(zoneLabel);
            zoneGroup.appendChild(zoneSelect);
            form.appendChild(zoneGroup);

            // Activity domain field
            const activityGroup = document.createElement('div');
            activityGroup.style.marginBottom = '15px';
            
            const activityLabel = document.createElement('label');
            activityLabel.textContent = 'Activity Domain:';
            activityLabel.style.display = 'block';
            activityLabel.style.marginBottom = '5px';
            
            const activityInput = document.createElement('input');
            activityInput.type = 'text';
            activityInput.style.width = '100%';
            activityInput.style.padding = '8px';
            activityInput.style.boxSizing = 'border-box';
            activityInput.required = true;
            
            activityGroup.appendChild(activityLabel);
            activityGroup.appendChild(activityInput);
            form.appendChild(activityGroup);

            // Prise en charge field
            const chargeGroup = document.createElement('div');
            chargeGroup.style.marginBottom = '20px';
            
            const chargeLabel = document.createElement('label');
            chargeLabel.textContent = 'Prise en Charge:';
            chargeLabel.style.display = 'block';
            chargeLabel.style.marginBottom = '5px';
            
            const chargeInput = document.createElement('input');
            chargeInput.type = 'text';
            chargeInput.style.width = '100%';
            chargeInput.style.padding = '8px';
            chargeInput.style.boxSizing = 'border-box';
            chargeInput.required = true;
            
            chargeGroup.appendChild(chargeLabel);
            chargeGroup.appendChild(chargeInput);
            form.appendChild(chargeGroup);

            // Buttons container
            const buttonsGroup = document.createElement('div');
            buttonsGroup.style.display = 'flex';
            buttonsGroup.style.justifyContent = 'flex-end';
            buttonsGroup.style.gap = '10px';

            // Cancel button
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.type = 'button';
            cancelBtn.style.padding = '8px 16px';
            cancelBtn.onclick = () => {
                document.body.removeChild(modal);
                resolve(null);
            };

            // Submit button
            const submitBtn = document.createElement('button');
            submitBtn.textContent = 'Sell';
            submitBtn.type = 'submit';
            submitBtn.style.padding = '8px 16px';
            submitBtn.style.backgroundColor = '#4CAF50';
            submitBtn.style.color = 'white';
            submitBtn.style.border = 'none';
            submitBtn.style.borderRadius = '4px';

            buttonsGroup.appendChild(cancelBtn);
            buttonsGroup.appendChild(submitBtn);
            form.appendChild(buttonsGroup);

            // Form submission handler
            form.onsubmit = (e) => {
                e.preventDefault();
                document.body.removeChild(modal);
                resolve({
                    quantity: parseInt(quantityInput.value),
                    client: clientInput.value,
                    clientZone: zoneSelect.value,
                    clientActivityDomain: activityInput.value,
                    priseEnCharge: chargeInput.value
                });
            };

            formContainer.appendChild(form);
            modal.appendChild(formContainer);
            document.body.appendChild(modal);

            // Focus on first input
            quantityInput.focus();
        });
    };

    try {
        const formData = await showSellForm(currentQte);
        if (!formData) return; // User canceled

        // Validate quantity again (in case user modified DOM)
        if (formData.quantity <= 0 || formData.quantity > currentQte) {
            alert(`Invalid quantity. Please enter a positive number not greater than ${currentQte}.`);
            return;
        }

        const payload = {
            quantityChange: formData.quantity,
            recordedBy: userCin,
            client: formData.client,
            clientZone: formData.clientZone,
            clientActivityDomain: formData.clientActivityDomain,
            priseEnCharge: formData.priseEnCharge
        };

        const response = await fetch(`/api/users/${articleId}/sell`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        alert(`Successfully sold ${formData.quantity} units of the article.`);
        fetchArticles();
    } catch (error) {
        console.error('Error selling article:', error);
        alert('Failed to sell article. Please try again.');
    }
};



        window.handleChangeDepo = async function(articleId, currentQte, userCin) {
            if (currentQte <= 0) {
                alert('Cannot change depot for an article with a quantity of 0.');
                return;
            }

            if (!userCin) {
                alert('User information not available. Please refresh and try again.');
                return;
            }

            const quantityToMove = prompt(`Enter quantity to move (current: ${currentQte}):`);
            if (quantityToMove === null || quantityToMove === '') {
                return;
            }
            
            const qte = parseInt(quantityToMove, 10);

            if (isNaN(qte) || qte <= 0 || qte > currentQte) {
                alert(`Invalid quantity. Please enter a positive number not greater than ${currentQte}.`);
                return;
            }
            
            const newLocation = prompt('Enter the other depot location:');
            if (newLocation === null || newLocation === '') {
                alert('New location cannot be empty.');
                return;
            }

            const payload = {
                quantityChange: qte,
                newLocation: newLocation,
                recordedBy: userCin
            };

            try {
                const response = await fetch(`/api/users/articles/${articleId}/change-depo`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                alert(`Successfully moved ${qte} units.`);
                fetchArticles(); // This now works
            } catch (error) {
                console.error('Error changing depot:', error);
                alert('Failed to change depot. Please try again.');
            }
        }
        
        window.handleAddFromDepo = async function(articleId, userCin) {
            if (!userCin) {
                alert('User information not available. Please refresh and try again.');
                return;
            }

            const quantityToAdd = prompt('Enter quantity to add:');
            if (quantityToAdd === null || quantityToAdd === '') {
                return;
            }

            const qte = parseInt(quantityToAdd, 10);
            if (isNaN(qte) || qte <= 0) {
                alert('Invalid quantity. Please enter a positive number.');
                return;
            }

            const newLocation = prompt('Enter the new depot location:');
            if (newLocation === null || newLocation === '') {
                alert('New location cannot be empty.');
                return;
            }

            const payload = {
                quantityChange: qte,
                newLocation: newLocation,
                recordedBy: userCin
            };

            try {
                const response = await fetch(`/api/users/articles/${articleId}/add-from-depo`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                alert(`Successfully added ${qte} units of the article to ${newLocation}.`);
                fetchArticles(); // This now works
            } catch (error) {
                console.error('Error adding from depot:', error);
                alert('Failed to add from depot. Please try again.');
            }
        }
        
        // This function is now in the global scope
        function calculateMovementSpeed(article, movements) {
            if (!article.movementTimeframe || article.fastSalesThreshold === null || article.mediumSalesThreshold === null) {
                return { speed: 'N/A', cssClass: '' };
            }

            let totalSales = 0;
            let startDate = new Date();
            
            switch (article.movementTimeframe) {
                case 'WEEK':
                    startDate.setDate(startDate.getDate() - 7);
                    break;
                case 'MONTH':
                    startDate.setMonth(startDate.getMonth() - 1);
                    break;
                case 'YEAR':
                    startDate.setFullYear(startDate.getFullYear() - 1);
                    break;
                default:
                    return { speed: 'N/A', cssClass: '' };
            }

            movements.forEach(movement => {
                const movementDate = new Date(movement.timestamp);
                if (movement.article.articleId === article.articleId && movement.reason.toLowerCase() === 'sold' && movementDate >= startDate) {
                    totalSales += Math.abs(movement.quantityChange);
                }
            });

            let speed = '';
            let cssClass = '';
            if (totalSales >= article.fastSalesThreshold) {
                speed = 'Fast';
                cssClass = 'fast-movement';
            } else if (totalSales >= article.mediumSalesThreshold) {
                speed = 'Medium';
                cssClass = 'medium-movement';
            } else {
                speed = 'Slow';
                cssClass = 'slow-movement';
            }
            
            return { speed, cssClass };
        }

        // This function is now in the global scope
        function renderArticles(articlesToDisplay) {
            articlesListBody.innerHTML = '';
            if (articlesToDisplay.length === 0) {
                articlesListBody.innerHTML = '<tr><td colspan="6">No articles found.</td></tr>';
                return;
            }
            articlesToDisplay.forEach(article => {
                const row = articlesListBody.insertRow();
                // Add a data-id attribute to the row for a click listener
                row.dataset.articleId = article.articleId;
                row.style.cursor = 'pointer'; // Add a cursor pointer to indicate it's clickable

                const roleName = article.role && article.role.name ? article.role.name : 'N/A';
                
                const soldButton = `<button class="sold-button" data-article-id="${article.articleId}" data-qte="${article.qte}" ${article.qte <= 0 ? 'disabled' : ''}>Sold</button>`;
                const changeDepoButton = `<button class="change-depo-button" data-article-id="${article.articleId}" data-qte="${article.qte}" ${article.qte <= 0 ? 'disabled' : ''}>Change Depo</button>`;
                const { speed, cssClass } = calculateMovementSpeed(article, allMovements);
                const addDepoButton = `<button class="add-depo-button" data-article-id="${article.articleId}">Add from Depo</button>`;

                const designationWithLocation = article.location ? `${article.designation} (${article.location})` : article.designation;

                row.innerHTML = `
                    <td>${article.codeArticle}</td>
                    <td>${designationWithLocation}</td>
                    <td>${article.qte}</td>
                    <td class="article-role-col">${roleName}</td>
                    <td class="movement-speed-cell ${cssClass}">${speed}</td>
                    <td class="actions-col">${soldButton} ${changeDepoButton} ${addDepoButton}</td>
                `;
            });
        }
        
        // This function is now in the global scope
        function filterAndRenderArticles() {
            const searchTerm = searchInput.value.toLowerCase();
            let filteredArticles = allArticles.filter(article => {
                const matchesSearch = article.codeArticle.toLowerCase().includes(searchTerm) ||
                                        article.designation.toLowerCase().includes(searchTerm);
                
                const articleRoleName = article.role && article.role.name ? article.role.name : 'N/A';
                const matchesRole = selectedRoles.length === 0 || selectedRoles.includes(articleRoleName);

                return matchesSearch && matchesRole;
            });
            renderArticles(filteredArticles);
        }

        // This function is now in the global scope
        async function fetchArticles() {
            loadingMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            try {
                const [articlesResponse, movementsResponse] = await Promise.all([
                    fetch('/api/users/articles'),
                    fetch('/api/article-movements')
                ]);

                if (!articlesResponse.ok) {
                    throw new Error(`HTTP error! status: ${articlesResponse.status}`);
                }
                if (!movementsResponse.ok) {
                    throw new Error(`HTTP error! status: ${movementsResponse.status}`);
                }

                allArticles = await articlesResponse.json();
                allMovements = await movementsResponse.json();
                loadingMessage.style.display = 'none';

                if (currentUserRole === 'Admin') {
                    roleHeaderCol.style.display = 'table-cell';
                    document.querySelectorAll('.article-role-col').forEach(el => el.style.display = 'table-cell');
                    renderArticles(allArticles);
                } else {
                    const filteredByRole = allArticles.filter(article => 
                        article.role && article.role.name === currentUserRole
                    );
                    renderArticles(filteredByRole);
                }
            } catch (error) {
                console.error('Error fetching articles:', error);
                loadingMessage.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Failed to load articles. Please try again later.';
            }
        }
        
        // This function is now in the global scope
        async function fetchUserRole() {
            if (!loggedInUserId) {
                console.error('No user logged in.');
                userInfoDisplay.textContent = 'No user logged in.';
                return;
            }
            try {
                const response = await fetch(`/api/users/${loggedInUserId}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const user = await response.json();
                currentUserRole = user.roleName;
                currentUserCin = user.userCin;
                userInfoDisplay.textContent = ``;

                if (currentUserRole === 'Admin') {
                    roleFilterContainer.style.display = 'block';
                }
            } catch (error) {
                console.error('Error fetching user role:', error);
                userInfoDisplay.textContent = 'Error loading user info.';
            }
        }
        
        // This function is now in the global scope
        async function fetchRolesAndPopulateDropdown() {
            try {
                const response = await fetch('/api/roles');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allRoles = await response.json();
                
                rolesDropdown.innerHTML = '';
                allRoles.forEach(role => {
                    const label = document.createElement('label');
                    label.innerHTML = `
                        <input type="checkbox" name="role" value="${role.name}"> ${role.name}
                    `;
                    rolesDropdown.appendChild(label);
                });

                rolesDropdown.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        const label = this.closest('label');
                        if (this.checked) {
                            selectedRoles.push(this.value);
                            label.classList.add('selected-role');
                        } else {
                            selectedRoles = selectedRoles.filter(role => role !== this.value);
                            label.classList.remove('selected-role');
                        }
                        filterAndRenderArticles();
                    });
                });
            } catch (error) {
                console.error('Error fetching roles:', error);
            }
        }
        
        // This function is now in the global scope
       function setupEventListeners() {
           articlesListBody.addEventListener('click', function(event) {
                const target = event.target;
                
                // Add new logic to handle clicks on the table row itself
                const row = target.closest('tr');
                if (row && row.dataset.articleId && !target.closest('button')) {
                    window.location.href = `/ArticleDetail.html?id=${row.dataset.articleId}`;
                    return; // Exit to prevent button actions from also being triggered
                }

                // Existing logic for buttons
                if (target.classList.contains('sold-button')) {
                    const articleId = target.dataset.articleId;
                    const currentQte = target.dataset.qte;
                    window.handleSellArticle(articleId, currentQte, currentUserCin);
                } else if (target.classList.contains('change-depo-button')) {
                    const articleId = target.dataset.articleId;
                    const currentQte = target.dataset.qte;
                    window.handleChangeDepo(articleId, currentQte, currentUserCin);
                } else if (target.classList.contains('add-depo-button')) {
                    const articleId = target.dataset.articleId;
                    window.handleAddFromDepo(articleId, currentUserCin);
                }
            });

            searchInput.addEventListener('keyup', filterAndRenderArticles);
            toggleRolesButton.addEventListener('click', () => {
                rolesDropdown.style.display = rolesDropdown.style.display === 'none' ? 'block' : 'none';
            });
            
            logoutButtonMainHeader.addEventListener('click', function() {
                sessionStorage.removeItem('loggedInUserId');
                window.location.href = '/index.html';
            });
        }
        
        document.addEventListener('DOMContentLoaded', async function() {
            document.body.classList.remove('is-preload');
        
            articlesListBody = document.getElementById('articles-list-body');
            searchInput = document.getElementById('article-search');
            loadingMessage = document.getElementById('loading-message');
            errorMessage = document.getElementById('error-message');
            roleFilterContainer = document.getElementById('role-filter-container');
            toggleRolesButton = document.getElementById('toggle-roles-button');
            rolesDropdown = document.getElementById('roles-dropdown');
            roleHeaderCol = document.getElementById('role-header-col');
            loggedInUserId = sessionStorage.getItem('loggedInUserId');
            userInfoDisplay = document.getElementById('user-info-display');
            logoutButtonMainHeader = document.getElementById('logout-button-main-header');
        
            await fetchUserRole();
            if (currentUserRole === 'Admin') {
                await fetchRolesAndPopulateDropdown();
            }
            await fetchArticles();
            setupEventListeners();
        });
    </script>
</body>
</html>
