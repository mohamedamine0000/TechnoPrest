<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- IMPORTANT: Link main.css first to load the theme's base styles -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- Then link login.css (your custom styles) to override/add specific rules -->
    <link rel="stylesheet" href="assets/css/login.css">
    <style>
        /* Basic styling for invalid input feedback */
        .is-invalid {
            border: 2px solid red !important; /* Red border for invalid input */
        }
        /* Style for the error message */
        .error-message {
            color: red;
            font-size: 0.85em;
            margin-top: 5px;
            display: block; /* Ensure it takes its own line */
        }
    </style>
</head>
<body class="is-preload">
    <!-- HTML5 UP themes often use a wrapper for overall page structure -->
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <!-- We'll place the login-container directly inside 'inner' -->
                <div class="login-container">
                    <!-- The form structure will now use HTML5 UP conventions -->
                    <form class="login-form" method="post" action="#" id="login-form"> <!-- Added an ID to the form -->
                        <h2>Login</h2>
                        <!-- Input fields using HTML5 UP's grid system if desired, or just direct styling -->
                        <div class="row gtr-uniform">
                            <div class="col-12">
                                <!-- CIN input field -->
                                <input type="text" name="CIN" id="CIN" placeholder="CIN (8 digits)" required />
                                <span id="cin-error" class="error-message" style="display: none;"></span> <!-- Error message span -->
                            </div>
                            <div class="col-12">
                                <input type="password" name="password" id="password" placeholder="Password" required />
                            </div>
                            <div class="col-12">
                                <ul class="actions" style="display: flex; justify-content: center;">
                                    <li><input type="submit" value="Log In" class="primary" /></li>
                                    <li><a href="signup.html" class="button">Sign Up</a></li>
                                </ul>
                            </div>
                        </div>
                        <!-- Added inline style to p.mt-4 for text color -->
                        <p class="mt-4" style="color: white;">Forgot your password? <a href="#">Reset here</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for CIN input validation -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form'); // Reference to the login form
            const cinInput = document.getElementById('CIN');
            const cinErrorSpan = document.getElementById('cin-error');

            // Function to validate CIN input
            function validateCin() {
                const value = cinInput.value.trim(); // Get current value and remove leading/trailing spaces
                let errorMessage = '';
                let isValid = true;

                // Check for non-numeric characters
                if (/[^0-9]/.test(value)) {
                    errorMessage = 'CIN can only contain numbers.';
                    isValid = false;
                }
                // Check for length (only if it's numeric or if it's empty)
                else if (value.length !== 8) {
                    errorMessage = 'CIN must be exactly 8 digits.';
                    isValid = false;
                }

                // Update error message display
                if (errorMessage) {
                    cinErrorSpan.textContent = errorMessage;
                    cinErrorSpan.style.display = 'block'; // Show the error message
                    cinInput.classList.add('is-invalid'); // Add red border
                } else {
                    cinErrorSpan.textContent = '';
                    cinErrorSpan.style.display = 'none'; // Hide the error message
                    cinInput.classList.remove('is-invalid'); // Remove red border
                }

                return isValid;
            }

            if (cinInput && cinErrorSpan && loginForm) {
                // Remove real-time validation on 'input' for this scenario
                // cinInput.addEventListener('input', validateCin); // Removed as per request

                // Prevent form submission if CIN is invalid
                loginForm.addEventListener('submit', function(event) {
                    // Run validation when the form is submitted
                    const isCinValid = validateCin();

                    if (!isCinValid) {
                        event.preventDefault(); // Stop the form from submitting
                        // Optional: Scroll to the invalid field or provide more prominent feedback
                        cinInput.focus(); // Focus on the CIN field
                    }
                });
            }
        });
    </script>
</body>
</html>
