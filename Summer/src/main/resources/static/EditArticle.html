<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <header id="header">
                    <a href="/profile.html" class="logo"><strong>My App</strong> Main Content</a>
                    <ul class="icons">
                        <li>
                            <button id="logout-button-main-header" class="fas fa-sign-out-alt">
                                <span class="label">Logout</span>
                            </button>
                        </li>
                    </ul>
                </header>

                <section>
                    <header class="main">
                        <h1>Edit Article</h1>
                    </header>

                    <form id="edit-article-form">
                        <div class="row gtr-uniform">
                            <div class="col-6 col-12-xsmall">
                                <label for="codeArticle">Article Code</label>
                                <input type="text" id="codeArticle" name="codeArticle" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="designation">Designation</label>
                                <input type="text" id="designation" name="designation" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="um">UM</label>
                                <input type="text" id="um" name="um" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="qte">Quantity</label>
                                <input type="number" id="qte" name="qte" value="0" min="0" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="minmumStock">Minimum Stock</label>
                                <input type="number" id="minmumStock" name="minmumStock" value="0" min="0" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="unite">Unit</label>
                                <input type="text" id="unite" name="unite" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="location">Location</label>
                                <input type="text" id="location" name="location" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="etagere">Shelf</label>
                                <input type="text" id="etagere" name="etagere" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="etat">State</label>
                                <div class="select-wrapper">
                                    <select name="etat" id="etat" required>
                                        <option value="Disponible">Disponible</option>
                                        <option value="Rupture">Rupture</option>
                                        <option value="Reserve">Reserve</option>
                                        <option value="CommandeEnCours">Commande En Cours</option>
                                        <option value="PartiellementDisponible">Partiellement Disponible</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div id="from-location-container" class="col-12" style="display: none;">
                                <div class="row gtr-uniform">
                                    <div class="col-12 col-12-xsmall">
                                        <label for="fromLocation">From Location</label>
                                        <input type="text" id="fromLocation" name="fromLocation">
                                    </div>
                                </div>
                            </div>
                            <div id="reserve-fields-container" class="col-12" style="display: none;">
                                <div class="row gtr-uniform">
                                    <div class="col-6 col-12-xsmall">
                                        <label for="reservedByWho">Reserved By</label>
                                        <input type="text" id="reservedByWho" name="reservedByWho">
                                    </div>
                                    <div class="col-6 col-12-xsmall">
                                        <label for="reservedToWho">Reserved To</label>
                                        <input type="text" id="reservedToWho" name="reservedToWho">
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="startDate">Date</label>
                                <input type="date" id="startDate" name="startDate" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="role">Role</label>
                                <div class="select-wrapper">
                                    <select name="role" id="role" required>
                                        <option value="" disabled selected>Loading roles...</option>
                                    </select>
                                </div>
                                <span id="role-error" class="error-message" style="display: none;"></span>
                            </div>
                            
                            <div class="col-6 col-12-xsmall">
                                <label for="movement-timeframe">Sales Movement Timeframe</label>
                                <div class="select-wrapper">
                                    <select id="movement-timeframe" name="movementTimeframe" required>
                                        <option value="WEEK">Week</option>
                                        <option value="MONTH">Month</option>
                                        <option value="YEAR">Year</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="fast-sales-threshold">Fast Sales Threshold</label>
                                <input type="number" id="fast-sales-threshold" name="fastSalesThreshold" required>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="medium-sales-threshold">Medium Sales Threshold</label>
                                <input type="number" id="medium-sales-threshold" name="mediumSalesThreshold" required>
                            </div>
                            <div class="col-12">
                                <ul class="actions">
                                    <li><input type="submit" value="Save Changes" class="primary"></li>
                                </ul>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const loggedInUserId = sessionStorage.getItem('loggedInUserId');
            const logoutButtonMainHeader = document.getElementById('logout-button-main-header');

            // Get article ID from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                alert("Article ID not found.");
                window.location.href = '/ListArticle.html';
                return;
            }

            // Form elements
            const articleForm = document.getElementById('edit-article-form');
            const codeArticleInput = document.getElementById('codeArticle');
            const designationInput = document.getElementById('designation');
            const umInput = document.getElementById('um');
            const qteInput = document.getElementById('qte');
            const minmumStockInput = document.getElementById('minmumStock');
            const uniteInput = document.getElementById('unite');
            const locationInput = document.getElementById('location');
            const etagereInput = document.getElementById('etagere');
            const etatInput = document.getElementById('etat');
            const dateInput = document.getElementById('startDate');
            const roleSelect = document.getElementById('role');
            const roleErrorSpan = document.getElementById('role-error');

            const fromLocationContainer = document.getElementById('from-location-container');
            const fromLocationInput = document.getElementById('fromLocation');
            const reservedByWhoInput = document.getElementById('reservedByWho');
            const reservedToWhoInput = document.getElementById('reservedToWho');
            const reserveFieldsContainer = document.getElementById('reserve-fields-container');
            
            const movementTimeframeInput = document.getElementById('movement-timeframe');
            const fastSalesThresholdInput = document.getElementById('fast-sales-threshold');
            const mediumSalesThresholdInput = document.getElementById('medium-sales-threshold');

            let currentUserRole = '';

            // Initialize role dropdown
            async function initializeRoleDropdown(articleRole) {
                if (!loggedInUserId) {
                    console.error('No logged in user ID found in session storage.');
                    return;
                }

                try {
                    const userResponse = await fetch(`/api/users/${loggedInUserId}`);
                    if (!userResponse.ok) {
                        throw new Error(`Failed to fetch user data. Status: ${userResponse.status}`);
                    }
                    const userData = await userResponse.json();
                    currentUserRole = userData.roleName;

                    const rolesResponse = await fetch('/api/roles');
                    if (!rolesResponse.ok) {
                        throw new Error(`Failed to load roles. Status: ${rolesResponse.status}`);
                    }
                    const roles = await rolesResponse.json();

                    roleSelect.innerHTML = '';
                    
                    if (currentUserRole.toLowerCase() === 'admin') {
                        roles.forEach(role => {
                            const option = document.createElement('option');
                            option.value = role.id;
                            option.textContent = role.name;
                            roleSelect.appendChild(option);
                        });
                        roleSelect.disabled = false;
                    } else {
                         const userRoleData = roles.find(role => role.name === currentUserRole);
                         if (userRoleData) {
                            const option = document.createElement('option');
                            option.value = userRoleData.id;
                            option.textContent = userRoleData.name;
                            option.selected = true;
                            roleSelect.appendChild(option);
                         }
                         roleSelect.disabled = true;
                    }
                    
                    if (articleRole && articleRole.id) {
                        roleSelect.value = articleRole.id;
                    }

                } catch (error) {
                    console.error('Error initializing role dropdown:', error);
                    if (roleErrorSpan) {
                         roleErrorSpan.textContent = 'Failed to load roles.';
                         roleErrorSpan.style.display = 'block';
                    }
                }
            }

            // Check if user is logged in
            if (!loggedInUserId) {
                alert('No user logged in. Redirecting to login...');
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 2000);
                return;
            }

            // Fetch and populate article data
            try {
                const response = await fetch(`/api/users/articles/${articleId}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const article = await response.json();

                codeArticleInput.value = article.codeArticle || '';
                designationInput.value = article.designation || '';
                umInput.value = article.um || '';
                qteInput.value = article.qte || '';
                minmumStockInput.value = article.minmumStock || '';
                uniteInput.value = article.unite || '';
                locationInput.value = article.location || '';
                etagereInput.value = article.etagere || '';
                etatInput.value = article.etat || 'Disponible';
                
                // Format date correctly
                if (article.date) {
                    const dateObj = new Date(article.date);
                    const formattedDate = dateObj.toISOString().split('T')[0];
                    dateInput.value = formattedDate;
                } else {
                    dateInput.value = '';
                }
                
                initializeRoleDropdown(article.role);
                
                movementTimeframeInput.value = article.movementTimeframe || 'WEEK';
                fastSalesThresholdInput.value = article.fastSalesThreshold || '';
                mediumSalesThresholdInput.value = article.mediumSalesThreshold || '';
                
                if (article.etat === 'Reserve') {
                    reservedByWhoInput.value = article.reservedByWho || '';
                    reservedToWhoInput.value = article.reservedToWho || '';
                    reserveFieldsContainer.style.display = 'flex';
                }
                
            } catch (error) {
                console.error('Error fetching article data:', error);
                alert('Could not retrieve article data. Please try again.');
                window.location.href = '/sidebar.html';
                return;
            }

            // Handle state change for Reserve option
            if (etatInput) {
                etatInput.addEventListener('change', function() {
                    if (this.value === 'Reserve') {
                        reserveFieldsContainer.style.display = 'flex';
                    } else {
                        reserveFieldsContainer.style.display = 'none';
                        reservedByWhoInput.value = '';
                        reservedToWhoInput.value = '';
                    }
                });
            }

            // Handle form submission
            articleForm.addEventListener('submit', async function(event) {
                event.preventDefault();

                if (!loggedInUserId) {
                    displayMessageBox('You must be logged in to edit an article.', 'error');
                    return;
                }

                if (!roleSelect.value) {
                    displayMessageBox('Please select a role before submitting.', 'error');
                    return;
                }
                
                const updatedArticleData = {
                    codeArticle: codeArticleInput.value,
                    designation: designationInput.value,
                    um: umInput.value,
                    qte: parseInt(qteInput.value, 10),
                    minmumStock: parseInt(minmumStockInput.value, 10),
                    unite: uniteInput.value,
                    location: locationInput.value,
                    etagere: etagereInput.value,
                    etat: etatInput.value,
                    date: dateInput.value,
                    role: {
                        id: parseInt(roleSelect.value, 10)
                    },
                    fromLocation: null,
                    movementTimeframe: movementTimeframeInput.value,
                    fastSalesThreshold: parseInt(fastSalesThresholdInput.value, 10),
                    mediumSalesThreshold: parseInt(mediumSalesThresholdInput.value, 10),
                    reservedByWho: reservedByWhoInput.value,
                    reservedToWho: reservedToWhoInput.value
                };
                
                try {
                    const response = await fetch(`/api/users/articles/${articleId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updatedArticleData)
                    });

                    if (response.ok) {
                        displayMessageBox('Article updated successfully!', 'success');
                        setTimeout(() => {
                           window.location.href = `/sidebar.html`;
                        }, 2000);
                    } else {
                        let errorData = await response.json().catch(() => ({ message: 'Could not parse error response.' }));
                        displayMessageBox(`Error updating article: ${errorData.message || 'Unknown error.'}`, 'error');
                    }
                } catch (error) {
                    console.error('Error submitting form:', error);
                    displayMessageBox('An unexpected network error occurred. Check if the server is running and the URL is correct.', 'error');
                }
            });

            // Logout functionality
            logoutButtonMainHeader.addEventListener('click', function() {
                sessionStorage.removeItem('loggedInUserId');
                window.location.href = '/index.html';
            });

            // Utility functions
            function displayMessageBox(message, type = 'info') {
                const messageBox = document.createElement('div');
                messageBox.style.position = 'fixed';
                messageBox.style.top = '20px';
                messageBox.style.left = '50%';
                messageBox.style.transform = 'translateX(-50%)';
                messageBox.style.backgroundColor = type === 'success' ? '#4CAF50' : (type === 'error' ? '#f44336' : '#007bff');
                messageBox.style.color = 'white';
                messageBox.style.padding = '15px 25px';
                messageBox.style.borderRadius = '8px';
                messageBox.style.zIndex = '3000';
                messageBox.style.boxShadow = '0 4px 8px rgba(0,0,0,0.2)';
                messageBox.style.opacity = '0';
                messageBox.style.transition = 'opacity 0.3s ease-in-out';
                messageBox.textContent = message;
                document.body.appendChild(messageBox);

                setTimeout(() => {
                    messageBox.style.opacity = '1';
                }, 10);

                setTimeout(() => {
                    messageBox.style.opacity = '0';
                    messageBox.addEventListener('transitionend', () => messageBox.remove());
                }, 3000);
            }
        });
    </script>
</body>
</html>
